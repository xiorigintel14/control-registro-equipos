<!--
COPIA PORTÁTIL DEL SITIO EXISTENTE — 31/08/2026
Guarda este archivo como index.html para publicarlo en GitHub Pages.
Incluye interfaz, estilos, React y lector de códigos; no requiere CDN.
La cámara necesita HTTPS (o localhost), permiso y un navegador compatible.
Esta copia de un solo archivo NO incluye instalación PWA ni modo sin conexión.

CONEXIÓN PENDIENTE PARA GITHUB PAGES:
Configura apiBase abajo con la URL HTTPS de TU backend autenticado.
Debe implementar GET/POST /api/prefixes y POST /api/movements.
Debe permitir CORS únicamente desde tu origen GitHub Pages y validar acceso.
No basta con pegar la URL de Apps Script en apiBase.
No pongas APPS_SCRIPT_SECRET ni otras claves en este HTML: sería información pública.
El backend debe guardar APPS_SCRIPT_URL y APPS_SCRIPT_SECRET como secretos.
El servidor actual de Sites no se configura automáticamente como backend externo.

CONTRATO COMPATIBLE CON EL SITIO:
GET /api/prefixes => {ok:true,prefijos:[{prefijo,marca,tipo,activo}]}
POST /api/prefixes: {accion:"guardarPrefijo",prefijo,marca,tipo}
                  o {accion:"cambiarEstadoPrefijo",prefijo,activo}
POST /api/movements: {movement:"Stock"|"Entregado",code,type,brand}
Las etiquetas Ingresar/Despachar conservan esos valores internos por compatibilidad.
El backend traduce a registrar + RECEPCION/DEVOLUCION para Apps Script.
Éxitos: HTTP 200 JSON. Fallos: HTTP 4xx/5xx con {error:"mensaje"}.
Apps Script sigue controlando actualización de estado y fecha en Google Sheets.
No se envían registros si falta configurar el backend; no se simula un guardado.
